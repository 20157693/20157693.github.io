<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <title>Contact | TAFE Student 20157693</title>
  </head>
  <body>
    <header>
      <img src="./assets/img/flag.png" width="48" height="32" alt="Flag of Mauritius">
      <h1>Portfolio</h1>
    </header>

    <nav aria-label="Main">
      <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="./about.html">About</a></li>
        <li><a href="./resume.html">Résumé</a></li>
        <li><a href="./projects.html">Projects</a></li>
        <li><a href="./mywork.html">Sample Project</a></li>
        <li><a href="./contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>

    <main class="single-column">
      <figure class="intro photo">
        <img src="./assets/img/profile-2.jpg" width="400" height="267" alt="Black and white portrait of me smiling">
      </figure>

      <article class="card-green">
        <h2>Contact Details</h2>
        <p>You may contact me at name+surname@gmail.com.</p>
        <p>I also do Instagram @aussielandscapes.</p>
      </article>

      <article class="card-fuchsia">
        <h2>Send a Message</h2>
        <form id="contact-form" novalidate>
          <label for="name">Name</label><br>
          <input type="text" id="name" name="name" autocomplete="name">
          <p class="error" id="name-error" aria-live="polite"></p>

          <label for="email">Email</label><br>
          <input type="email" id="email" name="email" autocomplete="email">
          <p class="error" id="email-error" aria-live="polite"></p>

          <label for="message">Message</label><br>
          <textarea id="message" name="message" rows="5"></textarea>
          <p class="error" id="message-error" aria-live="polite"></p>

          <button type="submit">Send</button>
        </form>
      </article>
    </main>

    <footer>
      <p>&copy; 2026 TAFE Student 20157693</p>
    </footer>

    <script src="./assets/js/contact.js"></script>
  </body>
</html>

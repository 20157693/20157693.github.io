    <main class="single-column">
      <section class="intro">
        <h2>Contact Me</h2>
        <figure>
          <img src="./assets/img/profile-2.jpg" width="400" height="267" alt="Black and white portrait of me smiling">
        </figure>
      </section>

      <article class="card-green">
        <h2>Contact Details</h2>
        <p>Placeholder: contact details will go here.</p>
      </article>

      <article class="card-fuchsia">
        <h2>Send a Message</h2>
        <form id="contact-form" novalidate>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name">
          <p class="error" id="name-error" aria-live="polite"></p>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email">
          <p class="error" id="email-error" aria-live="polite"></p>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5"></textarea>
          <p class="error" id="message-error" aria-live="polite"></p>

          <button type="submit">Send</button>
        </form>
      </article>
    </main>

    <footer>

    <script src="./assets/js/contact.js"></script>
